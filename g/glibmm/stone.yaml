name        : glibmm
version     : "2.90.0"
release     : 12
homepage    : https://gtkmm.org
upstreams   :
    - https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz : e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
summary     : C++ interface for the GLib library (2.68 ABI)
description : |
    C++ interface for the GLib library (2.68 ABI)
license     : LGPL-2.1-or-later AND GPL-2.0-or-later
builddeps   :
    - binary(doxygen)
    - binary(m4)
    - binary(mm-common-get)
    - binary(perl)
    - binary(python3)
    - binary(xsltproc)
    - pkgconfig(gio-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(mm-common-libstdc++)
    - pkgconfig(sigc++-3.0)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/lib/giomm-2.68/
            - /usr/lib/glibmm-2.68/
