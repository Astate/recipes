name        : gnome-shell-extensions
version     : "51.0"
release     : 15
homepage    : https://apps.gnome.org/Extensions/
upstreams   :
    - https://download.gnome.org/sources/gnome-shell-extensions/51/gnome-shell-extensions-51.0.tar.xz : 3c078d7b88faee3d0f68adcee1392b1bed84731b91a337ec894cc88aa8a8b813
summary     : Manage your GNOME Extensions
description : |
    GNOME Extensions handles updating extensions, configuring extension preferences and removing or disabling unwanted extensions.
license     : GPL-2.0-or-later
builddeps   :
    - binary(msgfmt)
rundeps     :
    - gnome-menus # apps menu ext
    - libgtop # system monitor ext
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
