name        : gnome-shell-extensions
version     : "50.3"
release     : 14
homepage    : https://apps.gnome.org/Extensions/
upstreams   :
    - https://download.gnome.org/sources/gnome-shell-extensions/50/gnome-shell-extensions-50.3.tar.xz : 68fc74306f88f697a6bcdb8243cb32a9ec0cd3f6e2bb92249b24b60fc57450b6
summary     : Manage your GNOME Extensions
description : |
    GNOME Extensions handles updating extensions, configuring extension preferences and removing or disabling unwanted extensions.
license     : GPL-2.0-or-later
builddeps   :
    - binary(msgfmt)
rundeps     :
    - gnome-menus # apps menu ext
    - libgtop # system monitor ext
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
