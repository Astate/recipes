name        : glib-networking
version     : "2.90.0"
release     : 9
homepage    : https://gitlab.gnome.org/GNOME/glib-networking
upstreams   :
    - https://download.gnome.org/sources/glib-networking/2.90/glib-networking-2.90.0.tar.xz : 83a75e3d9c36b66ee86d3281c2fc997816101968a5126ba322b2acb9a74dd8c0
summary     : Network extensions for GLib
description : |
    glib-networking contains the implementations of certain GLib networking features that cannot be implemented directly in GLib itself because of their dependencies.
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(msgfmt)
    - pkgconfig(glib-2.0)
    - pkgconfig(gsettings-desktop-schemas)
    - pkgconfig(libproxy-1.0)
    - pkgconfig(libssl)
setup       : |
    %meson -Dopenssl=enabled -Dgnutls=disabled
build       : |
    %meson_build
install     : |
    %meson_install
