name        : gcr
version     : "4.4.1"
release     : 10
homepage    : https://gitlab.gnome.org/GNOME/gcr
upstreams   :
    - https://download.gnome.org/sources/gcr/4.4/gcr-4.4.1.tar.xz : c4442c15d4330f17a1f5194df08c576877af68412ab2521446a93bd5e24c931b
summary     : GCR is a library for displaying certificates and crypto UI, accessing key stores
description : |
    GCR is a library for displaying certificates and crypto UI, accessing key stores. It also provides the viewer for crypto files on the GNOME desktop. GCK is a library for accessing PKCS#11 modules like smart cards, in a (G)object oriented way.
license     :
    - LGPL-2.0-or-later
builddeps   :
    - binary(gpg)
    - binary(msgfmt)
    - binary(ssh-add)
    - binary(ssh-agent)
    - binary(vapigen)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(libgcrypt)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsystemd)
    - pkgconfig(p11-kit-1)
    - pkgconfig(systemd)
setup       : |
    %meson \
        -Dgtk_doc=false
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libgck-2.so.*
            - /usr/lib/libgcr-4.so.*
            - /usr/lib/girepository-1.0/*.typelib

    - "%(name)":
        rundeps:
            - binary(gpg2)
            - binary(ssh-add)
            - binary(ssh-agent)
