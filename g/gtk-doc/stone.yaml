name        : gtk-doc
version     : "1.37.0"
release     : 12
homepage    : https://gitlab.gnome.org/GNOME/gtk-doc
upstreams   :
    - https://download.gnome.org/sources/gtk-doc/1.37/gtk-doc-1.37.0.tar.xz : 2facfb530ddcd20c03ed4758ef934e832626c393e2cacd23fc1249b7ed0e4246
summary     : Documentation generator for C code
description : |
    GTK-Doc is used to document C code. It is typically used to document the public
    API of libraries, such as GLib-based libraries, but it can also be used to
    document application code.
license     : FDL-1.1
builddeps   :
    # binary(dblatex)
    # binary(fop)
    - binary(itstool)
    - binary(msgmerge)
    - binary(xsltproc)
    - pkgconfig(glib-2.0)
    - python(parameterized)
    - python(pygments)
rundeps     :
    - binary(xsltproc)
    - python(pygments)
    - docbook
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
paths       :
    - /*
