name        : gzip
version     : "1.15"
release     : 8
homepage    : https://www.gnu.org/software/gzip/
upstreams   :
    - https://mirrors.kernel.org/gnu/gzip/gzip-1.15.tar.xz : 9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48
summary     : GNU Zip Compression Utilities
description : |
    GNU Gzip is a popular data compression program originally written by Jean-loup Gailly for the GNU project. Mark Adler wrote the decompression part.
license     :
    - GPL-3.0-or-later
tuning      :
    - lto: full
setup       : |
    # This patches Makefile.am
    %patch %(pkgdir)/disable-tests-failing-only-inside-boulder.patch
    # so re-run automake
    %reconfigure
build       : |
    %make
install     : |
    %make_install
check      : |
    %make check
