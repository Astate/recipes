name        : gmmlib
version     : "22.10.1"
release     : 7
homepage    : https://github.com/intel/gmmlib/
upstreams   :
    - https://github.com/intel/gmmlib/archive/refs/tags/intel-gmmlib-22.10.1.tar.gz : 33ebb6e65a2617c59f95a9e70ce0cbeca098316cd265345a0f4db5b381f1024c
summary     : Intel(R) Graphics Memory Management Library
description : |
    Intel(R) Graphics Memory Management Library
license     : MIT
checkdeps   :
    - libgcc
setup       : |
    # This runs the test suite after the install for some odd reason
    %cmake \
        -DRUN_TEST_SUITE=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - lto: full
    - optimize: speed
