name        : gmmlib
version     : "22.10.2"
release     : 8
homepage    : https://github.com/intel/gmmlib/
upstreams   :
    - https://github.com/intel/gmmlib/archive/refs/tags/intel-gmmlib-22.10.2.tar.gz : 94d0038ef92bb65b86d08f004197c56f8d81f82f9ac7a25c202a88afd653a30b
summary     : Intel(R) Graphics Memory Management Library
description : |
    Intel(R) Graphics Memory Management Library
license     : MIT
checkdeps   :
    - libgcc
setup       : |
    # This runs the test suite after the install for some odd reason
    %cmake \
        -DRUN_TEST_SUITE=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - lto: full
    - optimize: speed
