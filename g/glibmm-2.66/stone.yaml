name        : glibmm-2.66
version     : "2.66.10"
release     : 6
homepage    : https://www.gtkmm.org
upstreams   :
    - https://download.gnome.org/sources/glibmm/2.66/glibmm-2.66.10.tar.xz : 2b61780203aed98e701d3ea57c8f353e7c8ada9706a79be782f6c5153dd035c0
summary     : C++ bindings for GLib
description : |
    glibmm is the C++ binding for the GLib library.
license     : LGPL-2.1-or-later
builddeps   :
    - binary(m4)
    - binary(mm-common-get)
    - binary(perl)
    - binary(python3)
    - binary(xsltproc)
    - pkgconfig(gio-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(sigc++-2.0)
packages    :
    - "%(name)-devel":
        paths:
            - /usr/lib/*/proc/*
            - /usr/lib/*/include/*
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
