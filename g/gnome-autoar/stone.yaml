name        : gnome-autoar
version     : "0.5.0"
release     : 5
homepage    : https://gitlab.gnome.org/GNOME/gnome-autoar
upstreams   :
    - https://download.gnome.org/sources/gnome-autoar/0.5/gnome-autoar-0.5.0.tar.xz : 70915cfbb226746a57d5c605771a01f60de317eab9bc3953f44df2712a53c836
summary     : Automatic archive functions for GNOME apps
description : |
    Automatic archive functions for GNOME apps
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(gi-docgen)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(libarchive)
    # - pkgconfig(gtk+-3.0)
    - binary(vapigen)
setup       : |
    %meson \
        -Dintrospection=enabled \
        -Dvapi=true
build       : |
    %meson_build
install     : |
    %meson_install
