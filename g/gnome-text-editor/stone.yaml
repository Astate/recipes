name        : gnome-text-editor
version     : "51.0"
release     : 17
homepage    : https://apps.gnome.org/TextEditor/
upstreams   :
    - https://download.gnome.org/sources/gnome-text-editor/51/gnome-text-editor-51.0.tar.xz : 2b76e6da1506346c54b36ba1a3aeedcd28f4cb7d6a8793d217f209456c92dd4c
summary     : A simple text editor
description : |
    Text Editor is a simple text editor that focuses on session management.
license     :
    - GPL-3.0-only
builddeps   :
    - binary(appstreamcli)
    - binary(itstool)
    - binary(msgfmt)
    - pkgconfig(editorconfig)
    - pkgconfig(gio-2.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libspelling-1)
setup       : |
    sed -i '/update_desktop_database/d' meson.build
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
