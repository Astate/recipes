name        : gnome-app-list
version     : "2026.08"
release     : 7
homepage    : https://gitlab.gnome.org/GNOME/gnome-app-list
upstreams   :
    - https://download.gnome.org/sources/gnome-app-list/2026/gnome-app-list-2026.08.tar.xz : 4142563951a5897cdc42db080d50edea2e7decf2d85da1d1e7fba2b02ec9f455
summary     : This project provides app recommendation data for the GNOME project
