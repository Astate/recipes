name        : gnome-online-accounts-gtk
version     : "3.50.11"
release     : 2
upstreams   :
    - https://github.com/xapp-project/gnome-online-accounts-gtk/archive/refs/tags/3.50.11.tar.gz : c4c14a9d7b06d3323a32f7835dde7a75070b7d5e62609223ee46b26545cf03ac
homepage    : https://github.com/xapp-project/gnome-online-accounts-gtk
license     : GPL-3.0-or-later
summary     : A GTK Frontend for GNOME Online Accounts
description : |
    A GTK Frontend for GNOME Online Accounts
builddeps   :
    - binary(msgfmt)
    - pkgconfig(glib-2.0)
    - pkgconfig(gio-2.0)
    - pkgconfig(goa-1.0)
    - pkgconfig(goa-backend-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)":
        rundeps:
            - gvfs-goa
            - xapp-symbolic-icons
