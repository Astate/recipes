name        : gnome-characters
version     : "51.0"
release     : 8
homepage    : https://apps.gnome.org/Characters/
upstreams   :
    - https://download.gnome.org/sources/gnome-characters/51/gnome-characters-51.0.tar.xz : 8b90e9d7fcff43622ed34677f0029cd74b440185f1639af48c439f63bebadc31
summary     : Character map application
description : |
    Characters is a simple utility application to find and insert unusual characters. It allows you to quickly find the character you are looking for by searching for keywords.

    You can also browse characters by categories, such as Punctuation, Pictures, etc.
license     : BSD-3-Clause
builddeps   :
    - binary(appstreamcli)
    - binary(msgfmt)
    - binary(update-desktop-database)
    - pkgconfig(gio-2.0)
    - pkgconfig(gjs-1.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(pango)
    - pkgconfig(pangoft2)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
