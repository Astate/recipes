name        : python-pytest-mock
version     : "3.15.1"
release     : 1
homepage    : https://github.com/pytest-dev/pytest-mock
upstreams   :
    - https://pypi.debian.net/pytest-mock/pytest_mock-3.15.1.tar.gz : 1849a238f6f396da19762269de72cb1814ab44416fa73a8686deac10b0d87a0f
summary     : Thin-wrapper around the mock package for easier use with pytest
description : |
    This plugin installs a mocker fixture which is a thin-wrapper around the patching API provided by the mock package, but with the benefit of not having to worry about undoing patches at the end of a test.
license     : MIT
builddeps   :
    - python(setuptools)
    - python(setuptools-scm)
rundeps     :
    - python(pytest)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
