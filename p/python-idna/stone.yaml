name        : python-idna
version     : "3.19"
release     : 7
homepage    : https://github.com/kjd/idna
upstreams   :
    - https://pypi.debian.net/idna/idna-3.19.tar.gz : 5e0811a4383b21dc5838069f801c4fb62113b7447663d2530d2bd6e77b49bf15
summary     : A python library to support the Internationalised Domain Names in Applications
description : |
    A python library to support the Internationalised Domain Names in Applications.
license     : BSD-3-Clause
builddeps   :
    - python(flit-core)
rundeps     :
    - binary(python3)
checkdeps   :
    - python(pytest)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    # TODO replace with pytest macro
    # tests/test_idna_properties.py needs unpackaged python-hypothesis
    PYTHONPATH="$PWD"/build/lib pytest --ignore=tests/test_idna_properties.py
