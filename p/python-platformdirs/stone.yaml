name        : python-platformdirs
version     : "4.11.8"
release     : 10
homepage    : https://github.com/tox-dev/platformdirs
upstreams   :
    - https://pypi.debian.net/platformdirs/platformdirs-4.11.8.tar.gz : f23abafea7dd4276d1f29104b83598d7dcc567cafd07c9c951e66665645437fc
summary     : A library to determine platform-specific system directories
description : |
    A library to determine platform-specific system directories
license     : MIT
builddeps   :
    - python(hatch-vcs)
    - python(hatchling)
rundeps     :
    - binary(python3)
checkdeps   :
    - python(appdirs)
    - python(pytest)
    - python(pytest-mock)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    # TODO replace with pytest macro
    PYTHONPATH="$PWD"/src pytest
