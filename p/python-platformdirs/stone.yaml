name        : python-platformdirs
version     : "4.11.3"
release     : 9
homepage    : https://github.com/tox-dev/platformdirs
upstreams   :
    - https://pypi.debian.net/platformdirs/platformdirs-4.11.3.tar.gz : 66a73d38a849810252df809a3d8bcbda8e26f6c189920e7535ad608a48dbb5ab
summary     : A library to determine platform-specific system directories
description : |
    A library to determine platform-specific system directories
license     : MIT
builddeps   :
    - python(hatch-vcs)
    - python(hatchling)
rundeps     :
    - binary(python3)
checkdeps   :
    - python(appdirs)
    - python(pytest)
    - python(pytest-mock)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    # TODO replace with pytest macro
    PYTHONPATH="$PWD"/src pytest
