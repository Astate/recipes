name        : python-meson-python
version     : "0.21.1"
release     : 4
homepage    : https://pypi.debian.net/meson-python
upstreams   :
    - https://pypi.debian.net/meson-python/meson_python-0.21.1.tar.gz : 78b3345dcbc0fed7b939e7e37a9faab35bddaae07bf62e7542c8ad479c395af5
summary     : Meson PEP 517 Python build backend
description : |
    meson-python is a Python build back-end built on top of the Meson build system. It enables using Meson for the configuration and build steps of Python packages.
license     :
    - MIT
builddeps   :
    - binary(meson)
    - binary(ninja)
    - binary(patchelf)
    - binary(python)
    - python(packaging)
    - python(pyproject-metadata)
rundeps     :
    - binary(meson)
    - python-libs
setup       : |
    sed -e '/ninja/d' -i pyproject.toml
build       : |
    %pyproject_build
install     : |
    %pyproject_install
