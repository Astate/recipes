name        : pulseaudio-qt
version     : "1.9.0"
release     : 5
homepage    : https://invent.kde.org/libraries/pulseaudio-qt
upstreams   :
    - https://download.kde.org/stable/pulseaudio-qt/pulseaudio-qt-1.9.0.tar.xz : c2aace3ac1a9c8c9b9c57ba0ffc99a3d310737cc004db0491802e03536e27c69
summary     : Qt framework C++ bindings library for the PulseAudio sound system
description : |
    Qt framework C++ bindings library for the PulseAudio sound system
license     : LGPL-3.0-only
builddeps   :
    - cmake(ECM)
    - cmake(Qt6Qml)
    - pkgconfig(libpulse)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-qt6":
        paths:
            - /usr/lib/libKF6PulseAudioQt.so.*

    - "%(name)-qt6-devel":
        rundeps:
            - "%(name)-qt6"
        paths:
            - /usr/include/KF6/
            - /usr/lib/cmake/KF6PulseAudioQt/
            - /usr/lib/pkgconfig/KF6PulseAudioQt.pc
            - /usr/lib/libKF6PulseAudioQt.so
            - /usr/lib/qt6/metatypes/*.json
