name        : pkgconf
version     : "3.0.5"
release     : 13
summary     : Package compiler and linker metadata toolkit
license     : ISC
homepage    : https://gitea.treehouse.systems/ariadne/pkgconf
description : |
    Package compiler and linker metadata toolkit
upstreams   :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.5.tar.gz: d0d2ebdb3c7bfa3ae6e879d80b60dfe1dd482cce9f8be8fd8651149d396a4c49
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    ln -sf pkgconf %(installroot)/usr/bin/pkg-config
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal/pkg.m4
