name        : pkgconf
version     : "3.0.6"
release     : 14
summary     : Package compiler and linker metadata toolkit
license     : ISC
homepage    : https://gitea.treehouse.systems/ariadne/pkgconf
description : |
    Package compiler and linker metadata toolkit
upstreams   :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.6.tar.gz: 01da06de506241a124faa7ba0a34b5ad549b49df8d280337d42d00e78ac37d5d
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    ln -sf pkgconf %(installroot)/usr/bin/pkg-config
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal/pkg.m4
