name        : python-pygobject
version     : "3.58.0"
release     : 20
homepage    : https://wiki.gnome.org/Projects/PyGObject
upstreams   :
    - https://download.gnome.org/sources/pygobject/3.58/pygobject-3.58.0.tar.gz : 45068697de3ffe46840ca369705f23118b34db4f7deb63f6eff079a6734ddcca
summary     : PyGObject is a Python package which provides bindings for GObject based libraries
description : |
    PyGObject is a Python package which provides bindings for GObject based libraries such as GTK, GStreamer, WebKitGTK, GLib, GIO and many more.
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(patchelf)
    - pkgconfig(cairo)
    - pkgconfig(cairo-gobject)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(libffi)
    - pkgconfig(py3cairo)
    - pkgconfig(python3)
    - python(build)
    - python(installer)
    - python(packaging)
    - python(wheel)
rundeps     :
    - gobject-introspection-runtime
    - python-libs
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
