name        : python-tomlkit
version     : "0.15.1"
release     : 1
homepage    : https://kislyuk.github.io/argcomplete/
upstreams   :
    - https://pypi.debian.net/tomlkit/tomlkit-0.15.1.tar.gz : e25bbf38843005246210a12982776f27f99cb9be67160e14434d0c0d21ee1e97
summary     : Style-preserving TOML library for Python
description : |
    TOML Kit is a 1.0.0-compliant TOML library. It includes a parser that preserves all comments, indentations, whitespace and internal element ordering, and makes them accessible and editable via an intuitive API.
license     : MIT
builddeps   :
    - python(poetry-core)
checkdeps   :
    - python(pytest)
rundeps     :
    - python-libs
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    PYTHONPATH="$PWD"/src pytest -vv
