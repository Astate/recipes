name        : plasma-wayland-protocols
version     : "1.23.0"
release     : 9
upstreams   :
    - https://download.kde.org/stable/plasma-wayland-protocols/plasma-wayland-protocols-1.23.0.tar.xz : 16c5ad917bde2ed795942dacba76654819ddc6a1566842325ef34e0b553ef138
homepage    : https://kde.org/plasma-desktop
license     : LGPL-2.1-or-later
summary     : Persistent platform-independent application settings.
description : |
    Persistent platform-independent application settings.
builddeps   :
    - cmake(ECM)
    - pkgconfig(wayland-scanner)
setup       : |
    # For whatever reason one of the cmake options added by the cmake_kf6 macro tries to make this pull in qt5
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/cmake/PlasmaWaylandProtocols/
