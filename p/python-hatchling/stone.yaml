name        : python-hatchling
version     : "1.32.0"
release     : 11
homepage    : https://pypi.org/project/hatchling/
upstreams   :
    - https://pypi.debian.net/hatchling/hatchling-1.32.0.tar.gz : 0bdbde4a52b06c37e3eca395f85a762bf0ef06fe374fd8ae429dc6be10230f5f
summary     : Modern, extensible Python build backend
description : |
    Modern, extensible Python build backend, as used by Hatch
license     :
    - MIT
builddeps   :
    - python(packaging)
    - python(pathspec)
    - python(pluggy)
    - python(tomlkit)
    - python(trove-classifiers)
rundeps     :
    - binary(python3)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
