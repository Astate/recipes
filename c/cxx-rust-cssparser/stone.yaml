name        : cxx-rust-cssparser
version     : "1.1.0"
release     : 3
upstreams   :
    - https://download.kde.org/stable/cxx-rust-cssparser/cxx-rust-cssparser-1.1.0.tar.xz : c88f883f67d132240f7ef5c8b8fe4f743a79c448b98ac88f2be3b68264840358
homepage    : https://kde.org/plasma-desktop/
license     :
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : Library for parsing CSS using the Rust cssparser crate
description : |
    Library for parsing CSS using the Rust cssparser crate
builddeps   :
    - binary(python3)
    - cmake(Corrosion)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
tuning      :
    - lto: false
networking  : true
setup       : |
    pushd rust
    %cargo_fetch
    popd

    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
