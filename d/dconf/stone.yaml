name        : dconf
version     : "51.0"
release     : 7
homepage    : https://wiki.gnome.org/Projects/dconf
upstreams   :
    - https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz : e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248
summary     : Configuration settings backend for GNOME
description : |
    dconf is a low-level configuration system. Its main purpose is to provide a backend to GSettings on platforms that don't already have configuration storage systems.
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(xsltproc)
    - pkgconfig(bash-completion)
    - pkgconfig(dbus-1)
    - pkgconfig(gio-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(systemd)
    - pkgconfig(vapigen)
    - docbook
    - docbook-xsl
environment : |
    %export_docbook_catalogs
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
