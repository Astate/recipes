name        : wluma
version     : "5.0.2"
release     : 7
upstreams   :
    - https://github.com/max-baz/wluma/releases/download/5.0.2/wluma-5.0.2-vendored.tar.gz : dba791eb805b00a3e861e5343fffa66ab9b90c8bff4499eb51c3585ae98972c6
homepage    : https://github.com/maximbaz/wluma
license     : ISC
summary     : Automatic brightness adjustment
description : |
    Automatic brightness adjustment based on screen contents and ALS
builddeps   :
    - pkgconfig(dbus-1)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(libv4l2)
    - pkgconfig(vulkan)
    # marked-man for man pages
build       : |
    %cargo_build
install     : |
    %cargo_install

    %install_file 90-wluma-backlight.rules -t %(installroot)%(udevrulesdir)
    %install_file wluma.service -t %(installroot)%(libdir)/systemd/user/
