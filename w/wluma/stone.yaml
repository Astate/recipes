name        : wluma
version     : "5.0.1"
release     : 6
upstreams   :
    - https://github.com/max-baz/wluma/releases/download/5.0.1/wluma-5.0.1-vendored.tar.gz : 642953fea05b0bd35945f2749351bb61d34fe1d5ffe96bb04d609bac9326c13e
homepage    : https://github.com/maximbaz/wluma
license     : ISC
summary     : Automatic brightness adjustment
description : |
    Automatic brightness adjustment based on screen contents and ALS
builddeps   :
    - pkgconfig(dbus-1)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(libv4l2)
    - pkgconfig(vulkan)
    # marked-man for man pages
build       : |
    %cargo_build
install     : |
    %cargo_install

    %install_file 90-wluma-backlight.rules -t %(installroot)%(udevrulesdir)
    %install_file wluma.service -t %(installroot)%(libdir)/systemd/user/
