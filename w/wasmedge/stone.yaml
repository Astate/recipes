name        : wasmedge
version     : "0.17.1"
release     : 1
upstreams   :
    - https://github.com/WasmEdge/WasmEdge/releases/download/0.17.1/WasmEdge-0.17.1-src.tar.gz : c8881a8c43407fc424ccd8586594a79068305b31c76aad0025efea9339be18e0
homepage    : https://wasmedge.org/
license     : Apache-2.0 AND CC0-1.0
