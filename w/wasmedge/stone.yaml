name        : wasmedge
version     : "0.17.2"
release     : 2
upstreams   :
    - https://github.com/WasmEdge/WasmEdge/releases/download/0.17.2/WasmEdge-0.17.2-src.tar.gz : 7f2ef28b45bc136ee1f13a3453caab91d0dd2ba141dce599008486b561a63eac
homepage    : https://wasmedge.org/
license     : Apache-2.0 AND CC0-1.0
summary     : High performance WebAssembly Virtual Machine
description : |
    High performance WebAssembly Virtual Machine
builddeps   :
    - binary(llvm-config-23)
    - cmake(LLVM)
    - cmake(blake3)
    - pkgconfig(fmt)
    - pkgconfig(spdlog)
    - lld-devel
setup       : |
    %patch %(pkgdir)/ftbfs-clang-fmt.patch

    %cmake \
        -DCMAKE_DISABLE_FIND_PACKAGE_blake3=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
