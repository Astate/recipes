name        : qt6-webview
version     : "6.12.0"
release     : 10
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtwebview-everywhere-src-6.12.0.tar.xz : bee0642225614d7fc9486a2ca6db7d2c82a28c311404d1503185a360792c504e
summary     : Qt6 WebView Library
description : |
    Qt WebView provides a way to display web content in a QML application without necessarily including a full web browser stack by using native APIs where it makes sense.
license     : LGPL-3.0-only
builddeps   :
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - cmake(Qt6WebEngineCore)
setup       : |
    %cmake_qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
