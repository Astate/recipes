name        : qt6-sensors
version     : "6.12.0"
release     : 10
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtsensors-everywhere-src-6.12.0.tar.xz : 861df58be8808cef777a1b531d7bec804d25733ec34e8ebbdafbe27040319090
summary     : Qt6 Sensors Module
description : |
    The Qt Sensors API provides access to sensor hardware via QML and C++ interfaces. The Qt Sensors API also provides a motion gesture recognition API for devices.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Quick)
    - cmake(Qt6Svg)
setup       : |
    %cmake_qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
