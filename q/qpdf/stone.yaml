name        : qpdf
version     : "12.4.1"
release     : 9
homepage    : https://qpdf.sf.net
upstreams   :
    - https://github.com/qpdf/qpdf/releases/download/v12.4.1/qpdf-12.4.1.tar.gz : f045aa277be2356ff53a89a8622945958291177d2483afc20ede7c8a8cd3873c
summary     : Command-line tools and library for transforming PDF files
description : |
    Command-line tools and library for transforming PDF files
license     : Apache-2.0
builddeps   :
    - pkgconfig(gnutls)
    - pkgconfig(libjpeg)
    - pkgconfig(libssl)
    - pkgconfig(zlib)
setup       : |
    %cmake \
        -DBUILD_STATIC_LIBS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install

    # Completions
    %install_file completions/bash/qpdf %(installroot)%(bashcompletionsdir)/qpdf
    %install_file completions/zsh/_qpdf %(installroot)%(zshcompletionsdir)/_qpdf
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libqpdf.so.*

    - "%(name)-docs":
        paths:
            - /usr/share/doc/qpdf
