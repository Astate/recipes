name        : qpdf
version     : "12.4.2"
release     : 11
homepage    : https://qpdf.sf.net
upstreams   :
    - https://github.com/qpdf/qpdf/releases/download/v12.4.2/qpdf-12.4.2.tar.gz : 8a58af5b6141319287c1883bec8bd1bd545b7567b7fc5e6ce5d25a1c85f36397
summary     : Command-line tools and library for transforming PDF files
description : |
    Command-line tools and library for transforming PDF files
license     : Apache-2.0
builddeps   :
    - pkgconfig(gnutls)
    - pkgconfig(libjpeg)
    - pkgconfig(libssl)
    - pkgconfig(zlib)
setup       : |
    %cmake \
        -DBUILD_STATIC_LIBS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install

    # Completions
    %install_file completions/bash/qpdf %(installroot)%(bashcompletionsdir)/qpdf
    %install_file completions/zsh/_qpdf %(installroot)%(zshcompletionsdir)/_qpdf
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libqpdf.so.*

    - "%(name)-docs":
        paths:
            - /usr/share/doc/qpdf
