name        : qt6-imageformats
version     : "6.11.2"
release     : 10
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtimageformats-everywhere-src-6.11.2.tar.xz : cecd8900f34b6550076309bc94f62f828008b633a4239e0a08c86788f41001f8
summary     : Qt6 plugins for additional image formats
description : |
    The core Qt Gui library by default supports reading and writing image files of the most common file formats and a few more. The Qt Image Formats add-on module provides optional support for other image file formats.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - cmake(Qt6CorePrivate)
    - pkgconfig(jasper)
    - pkgconfig(libtiff-4)
    - pkgconfig(libwebp)
    # TODO: libmng
setup       : |
    %cmake_qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
