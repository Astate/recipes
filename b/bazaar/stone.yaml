name        : bazaar
version     : "0.9.5"
release     : 8
homepage    : https://gitlab.gnome.org/World/bazaar
upstreams   :
    - https://gitlab.gnome.org/World/bazaar/-/archive/v0.9.5/bazaar-v0.9.5.tar.gz : 67dfd77cd10b4977c48822b2553aa1bca2361b99534f1cf1c49f511ded4a52c1
summary     : New App Store for GNOME
description : |
    Bazaar is a new app store for GNOME with a focus on discovering and installing applications and add-ons from Flatpak remotes, particularly Flathub.
license     : GPL-3.0-or-later
builddeps   :
    - binary(msgfmt)
    - binary(update-desktop-database)
    - binary(valac)
    - pkgconfig(appstream)
    - pkgconfig(blueprint-compiler)
    - pkgconfig(flatpak)
    - pkgconfig(glycin-2)
    - pkgconfig(glycin-gtk4-2)
    - pkgconfig(gtk4)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libdex-1)
    - pkgconfig(libproxy-1.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(malcontent-0)
    - pkgconfig(md4c)
    - pkgconfig(webkitgtk-6.0)
    - pkgconfig(xmlb)
    - pkgconfig(yaml-0.1)
    - python(babel)
setup       : |
    # Fixes build failure
    export CFLAGS+=" -Wno-format-nonliteral"

    # fatal error: 'appstream.h' file not found
    export CFLAGS+=" -I%(includedir)/appstream"

    %meson
build       : |
    %ninja
install     : |
    %ninja_install
