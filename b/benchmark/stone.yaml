name        : benchmark
version     : "1.9.5"
release     : 3
upstreams   :
    - https://github.com/google/benchmark/archive/refs/tags/v1.9.5.tar.gz : 9631341c82bac4a288bef951f8b26b41f69021794184ece969f8473977eaa340
homepage    : https://github.com/google/benchmark
license     : Apache-2.0
summary     : A microbenchmark support library
description : |
    A library that benchmarks code snippets, similar to unit tests.
builddeps   :
    - binary(python3)
setup       : |
    # clang++: error: argument unused during compilation: '-c' [-Werror,-Wunused-command-line-argument]
    export CXXFLAGS+=" -Wno-error=unused-command-line-argument"

    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DBENCHMARK_ENABLE_LTO=ON \
        -DBENCHMARK_ENABLE_GTEST_TESTS=OFF \
        -DBENCHMARK_INSTALL_DOCS=OFF \
        -DBENCHMARK_INSTALL_TOOLS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
