name        : bubblewrap
version     : "0.13.0"
release     : 9
homepage    : https://github.com/containers/bubblewrap
upstreams   :
    - https://github.com/containers/bubblewrap/releases/download/v0.13.0/bubblewrap-0.13.0.tar.xz : 4734237473c0e5d695e4e9034a34e43b2dbf5164655bd13fa59ae376b2b7a765
summary     : Low-level unprivileged sandboxing tool used by Flatpak and similar projects
description : |
    Low-level unprivileged sandboxing tool used by Flatpak and similar projects
license     : LGPL-2.1-or-later
builddeps   :
    - binary(bash)
    - binary(python3)
    - binary(xsltproc)
    - pkgconfig(libcap)
    - docbook-xsl
    # libselinux
environment : |
    %export_docbook_catalogs
setup       : |
    # assume_kernel should match the min kernel in glibc
    %meson \
        -Dassume_kernel=6.1.0
build       : |
    %meson_build
install     : |
    %meson_install
