name        : libsecret
version     : "0.21.8.2"
release     : 10
homepage    : https://wiki.gnome.org/Projects/Libsecret
upstreams   :
    - https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.8.2.tar.xz : 142948339c5b971d8f6a8c7099521f6fd319b6fe73d2694b4e6d3310ed28b6e6
summary     : Library for storing and retrieving passwords and other secrets
description : |
    %(name) is a library for storing and retrieving passwords and other secrets. It communicates with the "Secret Service" using D-Bus.
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(msgfmt)
    - binary(vapigen)
    - binary(xsltproc)
    - pkgconfig(bash-completion)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(libgcrypt)
    - pkgconfig(tss2-esys)
    - docbook
    - docbook-xsl
environment : |
    %export_docbook_catalogs
setup       : |
    %meson \
        -Dgtk_doc=false \
        -Dtpm2=true
build       : |
    %meson_build
install     : |
    %meson_install
