name        : libraw
version     : "0.22.3"
release     : 8
upstreams   :
    - https://www.libraw.org/data/LibRaw-0.22.3.tar.gz : 789f3c33466210a1a0907f747a97c715d21bbf4af712f257fcbbd90111b227e4
homepage    : https://www.libraw.org/
license     :
    - CDDL-1.0
    - LGPL-2.1-or-later
summary     : LibRaw is a library for reading RAW files from digital cameras
description : |
    LibRaw is a library for reading RAW files from digital cameras
builddeps   :
    - pkgconfig(lcms2)
    - pkgconfig(libjpeg)
    - pkgconfig(zlib)
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
packages    :
    - "%(name)-samples":
        summary: LibRaw sample programs
        description: LibRaw sample programs
        paths:
            - /usr/bin/
