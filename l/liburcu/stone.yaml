name        : liburcu
version     : "0.15.7"
release     : 9
homepage    : https://liburcu.org/
upstreams   :
    - https://lttng.org/files/urcu/userspace-rcu-0.15.7.tar.bz2 : 2556b83adc0f9b3ac8024e613e17d014d04c4c49110604ce55fcb14eae32edd3
summary     : liburcu is a LGPLv2.1 userspace RCU (read-copy-update) library
description : |
    liburcu is a LGPLv2.1 userspace RCU (read-copy-update) library
license     : LGPL-2.1-or-later
builddeps   :
    - binary(grep)
setup       : |
    %configure \
        --disable-static \
        --enable-compiler-atomic-builtins
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
tuning      :
    - lto: full
    - optimize: speed
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc/
