name        : libpcap
version     : "1.11.0"
release     : 11
homepage    : https://www.tcpdump.org/
upstreams   :
    - https://www.tcpdump.org/release/libpcap-1.11.0.tar.gz : 596389bc8560ea027dff9db8aaf6c173d992366d9aef4baf5d7c6d180b4d49ad
summary     : Platform-independent network traffic capture library
description : |
    Platform-independent network traffic capture library
license     : BSD-3-Clause
builddeps   :
    - binary(flex)
    - binary(yacc)
    - pkgconfig(bluez)
    - pkgconfig(dbus-1)
    - pkgconfig(libnl-3.0)
setup       : |
    %configure \
        --with-libnl
build       : |
    %make
install     : |
    %make_install
    rm -v %(installroot)/%(libdir)/libpcap.a
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/pcap-config
            - /usr/share/man/man1/pcap-config*
            - /usr/share/man/man5/
