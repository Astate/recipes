name        : libnfs
version     : "7.0.0"
release     : 2
homepage    : https://github.com/sahlberg/libnfs
upstreams   :
    - https://github.com/sahlberg/libnfs/archive/libnfs-7.0.0.tar.gz : d25c70537d60f1ab307b9cb5e9fb01acff71065fc9547b54dfaec109ba993003
summary     : A client library for accessing NFS shares over a network
description : |
    LIBNFS offers three different APIs: RAW, NFS ASYNC and NFS SYNC.
license     :
    - BSD-2-Clause
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - pkgconfig(gnutls)
setup       : |
    %cmake \
        -DENABLE_DOCUMENTATION=ON \
        -DENABLE_MULTITHREADING=ON \
        -DENABLE_UTILS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-utils":
        summary: Utilities for accessing NFS servers
        description: Utilities for accessing NFS servers
        paths:
            - /usr/bin/
            - /usr/share/man/man1/
