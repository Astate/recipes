name        : libtirpc
version     : "1.3.8"
release     : 8
homepage    : https://sourceforge.net/projects/libtirpc/
upstreams   :
    - https://downloads.sourceforge.net/libtirpc/libtirpc-1.3.8.tar.bz2 : 8839959bfcc7a0f4c609d8e4f53f1c67ae33de23775ec35beb39ff15adf11920
summary     : Transport-independent secure RPC library
description : |
    Transport-independent secure RPC libary
license     :
    - BSD-3-Clause
builddeps   :
    - pkgconfig(krb5)
environment : |
    # clang 16/17 changes
    export LDFLAGS="${LDFLAGS} -Wl,--undefined-version"
setup       : |
    %patch %(pkgdir)/make-netconfig-stateless.patch
    %configure \
        --disable-static \
        --sysconfdir=%(vendordir)%(sysconfdir)
build       : |
    %make
install     : |
    %make_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/man/
