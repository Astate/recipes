name        : libcloudproviders
version     : "0.4.1"
release     : 8
homepage    : https://gitlab.gnome.org/World/libcloudproviders
upstreams   :
    - https://download.gnome.org/sources/libcloudproviders/0.4/libcloudproviders-0.4.1.tar.xz : 3e123fa2a34f6dfd99897ebe5fec3dfa35d9cf4b192c28fe7fc90c5aafafcf5b
summary     : cloudproviders integration API
description : |
    libcloudproviders is a DBus API that allows cloud storage sync clients to expose their services. Clients such as file managers and desktop environments can then provide integrated access to the cloud providers services.
license     :
    - LGPL-3.0-or-later
builddeps   :
    - binary(vapigen)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-introspection-1.0)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/vala/vapi/
