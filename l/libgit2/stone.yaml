name        : libgit2
version     : "1.9.7"
release     : 11
homepage    : https://libgit2.org
upstreams   :
    - https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.7.tar.gz : 1a4fbe7589e814777ae76b64734ad80f4ecad22cd33a22682a2aaea4ae5375e7
summary    : libgit2 is a portable, pure C implementation of the Git core methods.
description: |
    libgit2 is a portable, pure C implementation of the Git core methods provided as a linkable library with a solid API, allowing to build Git functionality into your application.
license     : GPL-2.0-or-later
builddeps   :
    - pkgconfig(libcurl)
    - pkgconfig(libpcre2-posix)
    - pkgconfig(libssh2)
    - pkgconfig(openssl)
setup       : |
    %cmake \
        -DBUILD_TESTS=OFF \
        -DREGEX_BACKEND=pcre2 \
        -DUSE_THREADS:BOOL=ON \
        -DUSE_SSH:BOOL=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(libssh2)
