name        : libcupsfilters
version     : "2.2.1"
release     : 11
homepage    : https://github.com/OpenPrinting/libcupsfilters
upstreams   :
    - https://github.com/OpenPrinting/libcupsfilters/releases/download/2.2.1/libcupsfilters-2.2.1.tar.xz : 0a22b849d5068c4c86b20fbb4192d3faa3dabcc9ee844c8fd73710ed821d4860
summary     : CUPS filters library
description : |
    libcupsfilters is a library for CUPS filters.
license     : Apache-2.0
builddeps   :
    - binary(gs)
    - binary(msgfmt)
    - binary(pdftoppm)
    - pkgconfig(cups)
    - pkgconfig(dbus-1)
    - pkgconfig(fontconfig)
    - pkgconfig(lcms2)
    - pkgconfig(libexif)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - pkgconfig(pdfio)
    - dejavu-fonts-ttf
rundeps     :
    - binary(gs) # Called in filter functions
    - binary(pdftoppm)
    - colord # Integration with color profiles
    - dejavu-fonts-ttf
setup       : |
    %configure \
        --disable-mutool \
        --disable-static
build       : |
    %make
install     : |
    %make_install
