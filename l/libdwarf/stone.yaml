name        : libdwarf
version     : "2.3.3"
release     : 3
upstreams   :
    - https://github.com/davea42/libdwarf-code/releases/download/v2.3.3/libdwarf-2.3.3.tar.xz : bde13d1c49be6f2467326a6e0b3919247471455d16eefc3c6be26c7d4baca36a
homepage    : https://www.prevanders.net/dwarf.html
license     : LGPL-2.1-only AND BSD-2-Clause-FreeBSD
summary     : Library to access the DWARF Debugging file format
description : |
    Library to access the DWARF Debugging file format
builddeps   :
    - binary(python3)
    - pkgconfig(libzstd)
    - pkgconfig(zlib)
setup       : |
    %meson \
        -Ddwarfgen=true
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test
packages    :
    - "%(name)-tools":
        summary: Tools for accessing DWARF debugging information
        description: Tools for accessing DWARF debugging information
        paths:
            - /usr/bin/
            - /usr/share/dwarfdump/
            - /usr/share/man/
