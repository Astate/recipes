name        : libmicrohttpd
version     : "1.0.10"
release     : 13
homepage    : https://www.gnu.org/software/libmicrohttpd
upstreams   :
    - https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.10.tar.gz : 04bfe8ef75db7d629a33de767599765cecadc56274a39822d5d081030d577685
summary     : C library supposed to make it easy to run an embedded HTTP server
description : |
    GNU libmicrohttpd is a small C library that is supposed to make it easy to run an HTTP server as part of another application. GNU Libmicrohttpd is free software and part of the GNU project.
license     : LGPL-2.1-or-later
builddeps   :
    - pkgconfig(gnutls)
#checkdeps   :
#    - pkgconfig(libcurl)
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
#check       : |
#    %make check
