name        : kdegraphics-thumbnailers
version     : "26.08.0"
release     : 15
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kdegraphics-thumbnailers-26.08.0.tar.xz : 0f3bddb3663113a70a33fbb5e3d04729d456cc73181fad785abc22527358116e
homepage    : https://apps.kde.org/kdegraphics_thumbnailers/
license     : GPL-2.0-or-later
summary     : Thumbnailers for various graphics file formats
description : |
    Thumbnailers for various graphics file formats
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KDcrawQt6)
    - cmake(KExiv2Qt6)
    - cmake(KF6Archive)
    - cmake(KF6KIO)
    - cmake(QMobipocket6)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
