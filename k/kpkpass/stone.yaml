name        : kpkpass
version     : "26.08.0"
release     : 19
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kpkpass-26.08.0.tar.xz : 020411887330ff3be2455702b18b663940e5561eb232a003ca03a3b8bb0348bb
homepage    : https://invent.kde.org/pim/kpkpass
license     : LGPL-2.1-or-later
summary     : Apple Wallet Pass reader
description : |
    Library to deal with Apple Wallet pass files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Archive)
