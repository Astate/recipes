name        : kitinerary
version     : "26.08.0"
release     : 32
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kitinerary-26.08.0.tar.xz : b90eeba1507d99e0d911066955031854273938ff1e4f39f9cd4173f4a549515c
homepage    : https://invent.kde.org/pim/kitinerary
license     : LGPL-2.1-or-later
summary     : Data Model and Extraction System for Travel Reservation information
description : |
    A library containing itinerary data model and itinerary extraction code.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Contacts)
    - cmake(KF6I18n)
    - cmake(KF6Mime)
    - cmake(KPim6PkPass)
    - cmake(Qt6Qml)
    - cmake(libphonenumber)
    - pkgconfig(libxml-2.0)
    - pkgconfig(openssl)
    - pkgconfig(poppler)
    - pkgconfig(poppler-cpp)
    - pkgconfig(shared-mime-info)
    - pkgconfig(zlib)
    - pkgconfig(zxing)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
