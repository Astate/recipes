name        : kdegraphics-mobipocket
version     : "26.08.0"
release     : 16
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kdegraphics-mobipocket-26.08.0.tar.xz : 4223d58c7f137b3958879de96ef1870bff7348e2be671c7caab1aad1757f87d3
homepage    : https://invent.kde.org/graphics/kdegraphics-mobipocket
license     : GPL-2.0-or-later
summary     : Plugins for mobipocket
description : |
    A collection of plugins to handle mobipocket files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6Core5Compat)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
