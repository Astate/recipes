name        : ksanecore
version     : "26.08.0"
release     : 13
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/ksanecore-26.08.0.tar.xz : 40f5fa99ba0f0f3459d9671219100de6b1ad170fce15827ccd79c5b2855eb303
homepage    : https://invent.kde.org/libraries/ksanecore
license     :
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : Library providing logic to interface scanners
description : |
    KSaneCore is a library that provides a Qt interface for the SANE library for scanner hardware.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6I18n)
    - pkgconfig(sane-backends)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
