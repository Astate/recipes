name        : kunifiedpush
version     : "26.08.0"
release     : 16
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kunifiedpush-26.08.0.tar.xz : abd4a67798428023913a5343de747ec40fc7b2a19ed4a4f18650df9c755abd80
homepage    : https://invent.kde.org/libraries/kunifiedpush
license     : LGPL-2.0-or-later
summary     : UnifiedPush client library
description : |
    UnifiedPush client library and distributor daemon
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6I18n)
    - cmake(KF6KCMUtils)
    - cmake(KF6Service)
    - cmake(KF6Solid)
    - cmake(Qt6WebSockets)
    - pkgconfig(openssl)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
