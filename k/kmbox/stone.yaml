name        : kmbox
version     : "26.08.0"
release     : 18
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kmbox-26.08.0.tar.xz : 5ae46de9441b4af57e14643ffa84e40dde569bc12737d143d35bbbe977b6f9e4
homepage    : https://kde.org
license     : LGPL-2.1-or-later
summary     : KMBox provides API to access emails in storages in the MBox format
description : |
    KMBox provides API to access emails in storages in the MBox format.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Mime)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Mime)
