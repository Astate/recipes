name        : kio-admin
version     : "26.08.0"
release     : 13
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/kio-admin-26.08.0.tar.xz : 4d7dfe712004f1041481cc0a752c01c494983adf87f6df78568ba7198f7dc5f6
homepage    : https://invent.kde.org/system/kio-admin
license     : GPL-2.0-or-later
summary     : Manage files as administrator using the admin:// KIO protocol.
