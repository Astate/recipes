name        : erofs-utils
version     : "1.9.4"
release     : 12
homepage    : https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git
upstreams   :
    - https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-1.9.4.tar.gz : 7d135aa2550326a5acf20f53c518aea5a8900015ce50700044e40f818c31dd80
summary     : EROFS filesystem utilities
description : |
    EROFS filesystem utilities
license     :
    - GPL-2.0-or-later
    - Apache-2.0
    - MIT
builddeps   :
    - binary(flex)
    - binary(gettext)
    - pkgconfig(fuse3)
    - pkgconfig(json-c)
    - pkgconfig(libcurl)
    - pkgconfig(libdeflate)
    - pkgconfig(liblz4)
    - pkgconfig(liblzma)
    - pkgconfig(libnl-genl-3.0)
    - pkgconfig(libxml-2.0)
    - pkgconfig(libxxhash)
    - pkgconfig(libzstd)
    - pkgconfig(openssl)
    - pkgconfig(uuid)
    - pkgconfig(zlib)
setup       : |
    %reconfigure \
        --enable-fuse \
        --with-libdeflate
build       : |
    %make
install     : |
    %make_install
