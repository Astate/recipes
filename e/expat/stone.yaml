name        : expat
version     : "2.8.5"
release     : 19
summary     : An XML parser library
license     : MIT
homepage    : https://libexpat.github.io
description : |
    An XML parser library
upstreams   :
    - https://github.com/libexpat/libexpat/releases/download/R_2_8_5/expat-2.8.5.tar.xz: 1e727b8933ec51a77a9a9d9afcf8e688bce45d907c13e36ab7393fe36e703182
emul32      : true
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
workload    : |
    %make check
tuning      :
    - optimize : speed
    - lto : full
