name        : egl-wayland
version     : "1.1.23"
release     : 9
homepage    : https://github.com/NVIDIA/egl-wayland
upstreams   :
    - https://github.com/NVIDIA/egl-wayland/archive/refs/tags/1.1.23.tar.gz : 01a32227f24c6b5156c096a36b03de774ae8d5d3980c60bba2473a84e2c9c673
summary     : The Wayland External Platform interface for EGL
description : |
    The EGL External Platform interface for Wayland
license     : Apache-2.0
emul32      : true
builddeps   :
    - pkgconfig(eglexternalplatform)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(wayland-server)
    - pkgconfig32(egl)
    - pkgconfig32(libdrm)
    - pkgconfig32(wayland-client)
    - pkgconfig32(wayland-egl-backend)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/wayland-eglstream/
