name        : umbriel
version     : "0.1.0+git.8235b9e"
release     : 2
homepage    : https://github.com/noctalia-dev/umbriel
upstreams   :
    - git|https://github.com/noctalia-dev/umbriel.git :
        ref : 8235b9e0cb97725bcaec9fe1757f5597c847b7e6
        clonedir : umbriel
description : |
    Umbriel is a Wayland compositor built on wlroots and umbrielfx (a hard
    fork of SceneFX), from the Noctalia project. It pairs with the Noctalia
    shell for panels, notifications, launching and locking, and uses
    xwayland-satellite for X11 application support.
license     : MIT
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(egl)
    - pkgconfig(gbm)
    - pkgconfig(glesv2)
    - pkgconfig(jemalloc)
    - pkgconfig(lcms2)
    - pkgconfig(libdrm)
    - pkgconfig(libglvnd)
    - pkgconfig(libinput)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(wayland-server)
    - pkgconfig(wlroots-0.20)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(xwayland-satellite)
setup       : |
    %patch %(pkgdir)/0001-wlr-h-include-libc-headers-before-static-hack.patch
    %meson \
        -Db_ndebug=true \
        -Djemalloc=enabled
build       : |
    %meson_build
check       : |
    # `tests` defaults to auto, which upstream only resolves to enabled for
    # unsanitized debug builds; our plain/release build defines no test
    # targets, so this is a no-op rather than a real test run.
    %meson_test
install     : |
    # umbrielfx (the vendored SceneFX fork) is a plain subdir(), not a
    # subproject, and installs nothing on its own, so no --skip-subprojects
    # is needed here.
    %meson_install
