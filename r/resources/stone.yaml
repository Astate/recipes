name        : resources
version     : "51.0"
release     : 11
homepage    : https://github.com/nokyan/resources
upstreams   :
    - https://download.gnome.org/sources/resources/51/resources-51.0.tar.xz : ce1a01c1b772ceeb86e7a59cdb414f82f2196d50da63bae2072c7af8e3b4c735
summary     : Resources is a system information tool
description : |
    Resources is a system information tool written in Rust that displays information about your operating system, software and hardware.
license     : GPL-3.0-or-later
builddeps   :
    - binary(appstreamcli)
    - binary(cargo)
    - binary(desktop-file-validate)
    - binary(glib-compile-resources)
    - binary(glib-compile-schemas)
    - binary(msgfmt)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libsoup-3.0)
networking  : true
setup       : |
    %meson \
        --libexecdir=lib \
        -Dprofile=release
build       : |
    %meson_build
install     : |
    %meson_install
