name        : rsync
version     : "3.5.1"
release     : 8
homepage    : https://rsync.samba.org/
upstreams   :
    - https://rsync.samba.org/ftp/rsync/src/rsync-3.5.1.tar.gz : c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef
summary     : File transfer program to keep remote files in sync.
description : |
    Rsync is an open source utility that provides fast incremental file transfer.
license     : GPL-3.0+
builddeps   :
    - binary(python3)
    - pkgconfig(libacl)
    - pkgconfig(libidn2)
    - pkgconfig(liblz4)
    - pkgconfig(libxxhash)
    - pkgconfig(libzstd)
    - pkgconfig(openssl)
    - pkgconfig(popt)
    - pkgconfig(zlib)
setup       : |
    %configure \
        --with-included-popt=no \
        --with-included-zlib=no
build       : |
    %make
install     : |
    %make_install
