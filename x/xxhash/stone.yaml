name        : xxhash
version     : "0.8.4"
release     : 10
homepage    : https://github.com/Cyan4973/xxHash
upstreams   :
    - https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.4.tar.gz : 5738270935e7c3d38a79b3adf7c9692566ce7895a25f67de43ad52ab504acd32
summary     : Extremely fast non-cryptographic hash function
description : |
    xxHash is an Extremely fast Hash algorithm, processing at RAM speed limits. Code is highly portable, and produces hashes identical across all platforms (little / big endian).
license     :
    - BSD-2-Clause
    - GPL-2.0-or-later
tuning      :
    - icf: all
    - lto: full
    - nosemantic
    - symbolic
build       : |
    DISPATCH=1 %make
install     : |
    %make_install PREFIX=/usr
    # no static
    rm %(installroot)%(libdir)/*.a -v
