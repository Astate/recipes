name        : xz
version     : "5.8.4"
release     : 17
homepage    : https://tukaani.org/xz
upstreams   :
    - https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.gz : 0014c7886930454fe8bd4228665b51af55eeae560ea135c9c4cd33f55b2591d9
summary     : Library and command line tools for XZ and LZMA compressed files
description : |
    Library and command line tools for XZ and LZMA compressed files
license     :
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
emul32      : true
setup       : |
    %configure \
        --disable-static \
        --disable-rpath
build       : |
    %make
install     : |
    %make_install
workload    : |
    %make check || :
check       : |
    %make check || :
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc/*
