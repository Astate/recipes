name        : snappy
version     : "1.3.1"
release     : 5
upstreams   :
    - https://github.com/google/snappy/archive/1.3.1.tar.gz : 893f708a0bf4b5529d555ffcee390e940e932fcf90261f682604475a76cd0247
homepage    : https://google.github.io/snappy
license     : BSD-3-Clause
summary     : A compression/decompression library
description : |
    Snappy is a compression/decompression library. It does not aim for maximum compression, or compatibility with any other compression library; instead, it aims for very high speeds and reasonable compression.
builddeps   :
    - cmake(GTest)
    - cmake(benchmark)
setup       : |
    %patch %(pkgdir)/cmake_add_pkgconfig.patch
    %patch %(pkgdir)/system-gtest.patch

    cp %(pkgdir)/snappy.pc.in .

    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DSNAPPY_USE_BUNDLED_GTEST=OFF \
        -DSNAPPY_USE_BUNDLED_BENCHMARK_LIB=OFF \
        -DCMAKE_CXX_STANDARD=23
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
