name        : spirv-llvm-translator
version     : "23.1.2"
release     : 24
homepage    : https://github.com/KhronosGroup/SPIRV-LLVM-Translator
upstreams   :
    - https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/refs/tags/v23.1.2.tar.gz: b657254b5e0a2dda7914a8cb1eace467f22847d75d877b83829026c1452f827a
summary     : Tool/library for translation between SPIR-V and LLVM IR
description : |
    A tool and a library for bi-directional translation between SPIR-V and LLVM IR
license     :
    - Apache-2.0 WITH LLVM-exception
builddeps  :
    - binary(llvm-config-23)
    - pkgconfig(SPIRV-Tools)
setup       : |
    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=/usr/include/spirv
build       : |
    %cmake_build
install     : |
    %cmake_install
