name        : signon-kwallet-extension
version     : "26.08.0"
release     : 17
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/signon-kwallet-extension-26.08.0.tar.xz : ad8ea5a4e40ce7f2481c694ff44822b89ab572746c4a6a552a0039041e2ea9d7
homepage    : https://kde.org/
license     : GPL-2.0-or-later
summary     : KWallet integration for signon framework
description : |
    KWallet integration for signon framework
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Wallet)
    - pkgconfig(SignOnExtension)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
