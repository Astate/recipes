    - pkgconfig(gtk4)
    - pkgconfig(glycin-2)
    - pkgconfig(glycin-gtk4-2)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-pbutils-1.0)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(papers-document-4.0)
    - pkgconfig(webkitgtk-6.0)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
