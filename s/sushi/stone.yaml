name        : sushi
version     : "51.0"
release     : 3
homepage    : https://gitlab.gnome.org/GNOME/sushi
upstreams   :
    - https://gitlab.gnome.org/GNOME/sushi/-/archive/51.0/sushi-51.0.tar.gz : 521138ba0975a035ad9c2d7a7560b02cc97e6dbd13a23fc9c4fa086aec73a8ed
summary     : A file previewer for the GNOME desktop environment
description : |
    A file previewer for the GNOME desktop environment
license     : GPL-2.0-or-later
