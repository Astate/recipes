name        : scdoc
version     : "1.11.5"
release     : 6
homepage    : https://git.sr.ht/~sircmpwn/scdoc
upstreams   :
    - https://git.sr.ht/~sircmpwn/scdoc/archive/1.11.5.tar.gz : 98780bbdf16c1bce89ef3a8c0f537ac6e4ea77087b609e7698857614488a2a62
summary     : Simple man page generator
description : |
    scdoc is a simple man page generator for POSIX systems written in C99.
license     : MIT
build       : |
    %make PREFIX=/usr
install     : |
    %make_install PREFIX=/usr
packages    :
    - "%(name)":
        paths:
            - /usr/share/pkgconfig/scdoc.pc
