name        : akonadiconsole
version     : "26.08.0"
release     : 12
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.0/src/akonadiconsole-26.08.0.tar.xz : b8f352fe688cca9dd5712238f44a8fc57878709bf280adee4ab38a3f9de1f54d
homepage    : https://invent.kde.org/pim/akonadiconsole
license     :
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
summary     : Akonadi management and debugging console
description : |
    Akonadi management and debugging console
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6ItemViews)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiContactWidgets)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6AkonadiSearch)
    - cmake(KPim6CalendarSupport)
    - cmake(KPim6Libkdepim)
    - cmake(KPim6MessageViewer)
    - cmake(xapian)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
