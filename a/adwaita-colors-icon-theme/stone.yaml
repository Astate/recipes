name        : adwaita-colors-icon-theme
version     : "2.6"
release     : 6
homepage    : https://github.com/dpejoh/Adwaita-colors/
upstreams   :
    - https://github.com/dpejoh/Adwaita-colors/archive/refs/tags/v2.6.tar.gz : 8a25304dd641cdf3f096ec94d6b47dd7184aac8efb64a9995629cf3165dc8790
summary     : Customizes Adwaita icons to match your GNOME theme's accent color
description : |
    Adwaita Colors customizes Adwaita icons to match your GNOME theme's accent color, providing a cohesive, personalized look.
license     : GPL-3.0-or-later
builddeps   :
    - binary(gtk-update-icon-cache)
    - adwaita-icon-theme
    - adwaita-icon-theme-legacy
    - hicolor-icon-theme
rundeps      :
    - adwaita-icon-theme-legacy
    - hicolor-icon-theme
    - morewaita-icon-theme
build        : |
    ./setup -i -f -p "%(workdir)/generated-icons"
install      : |
    %install_dir %(installroot)%(datadir)/icons
    cp -r %(workdir)/generated-icons/Adwaita-* %(installroot)%(datadir)/icons/

    find "%(installroot)%(datadir)/icons" \
    -name index.theme \
    -exec sed -i \
        's/Inherits=Adwaita,/Inherits=MoreWaita,Adwaita,/g' \
        {} +

    for i in %(installroot)%(datadir)/icons/*/; do
        gtk-update-icon-cache -f $i
    done
