name        : mangowm
version     : "0.17.4"
release     : 8
homepage    : https://github.com/mangowm/mango
upstreams   :
        - https://github.com/mangowm/mango/archive/refs/tags/0.17.4.tar.gz : 0891dc5650cf4b7daf0298ce9c188f7ff81792d872c1396febba022635d68c8e
summary     : A Wayland compositor with smooth animation
description : |
    A wayland compositor utilizing wlroots as a base and SceneFX for aesthetics
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(libcjson)
    - pkgconfig(libpcre2-8)
    - pkgconfig(pango)
    - pkgconfig(scenefx)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wlroots)
setup       : |
    %patch %(pkgdir)/stateless-config.patch
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
