name        : mold
version     : "2.42.0"
release     : 14
summary     : A Modern Linker
license     : BSD-3-Clause
homepage    : https://github.com/rui314/mold
description : |
    mold is a faster drop-in replacement for existing Unix linkers.
upstreams   :
    - https://github.com/rui314/mold/archive/refs/tags/v2.42.0.tar.gz: 6c0f3308c5b3159a369202d970922ad819bab1bfcb5a3b3c06a723d19f65373e
builddeps   :
    - pkgconfig(libblake3)
    - pkgconfig(libzstd)
    # - pkgconfig(mimalloc)
    - pkgconfig(tbb)
    - pkgconfig(zlib)
    # - mimalloc-static
    # TODO: Use mimalloc 3
setup       : |
    %patch %(pkgdir)/0001-Set-default-settings-for-compression-and-build.patch

    # CMAKE_INSTALL_LIBEXECDIR is libdir because it already installs to a mold subdir
    %cmake \
        -DCMAKE_INSTALL_LIBEXECDIR="%(libdir)" \
        -DMOLD_LTO=ON \
        -DMOLD_MOSTLY_STATIC=OFF \
        -DMOLD_USE_SYSTEM_MIMALLOC=OFF \
        -DMOLD_USE_SYSTEM_TBB=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - icf: all
    - lto: full
    - nosemantic
    - symbolic
