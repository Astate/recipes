name        : miriway
version     : "26.08.1"
release     : 1
upstreams   :
    - https://github.com/Miriway/Miriway/archive/refs/tags/v26.08.1.tar.gz : e80b763bbb3fde8c8a98c13f6380d6d64e9702816733fa1bd733ca4aa353a3b6
homepage    : https://github.com/Miriway/Miriway
license     : GPL-3.0-only
summary     : Mir based Wayland compositor
description : |
    Miriway is a starting point for creating a Wayland based desktop environment using Mir.

    Miriway has been tested with shell components from several desktop environments and comes with some scripts to help set up a variety of example configurations.
builddeps   :
    - pkgconfig(miral)
    - pkgconfig(mirwayland)
    - pkgconfig(xkbcommon)
setup       : |
    %cmake \
        -DCMAKE_INSTALL_SYSCONFDIR:PATH=%(datadir) \
        -DSDDM:BOOL=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
