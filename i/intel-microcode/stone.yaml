name        : intel-microcode
version     : "20260925"
release     : 22
homepage    : https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files
upstreams   :
    - https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files/archive/refs/tags/microcode-20260925.tar.gz : 0ec19023dad1e6dd0c5909174b8dff2555b91cf01671e36271a1ef36655c0cfc
summary     : Microcode for Intel CPUs
description : |
    Microcode package for Intel CPUs. You do not need to install this package unless
    you are building a custom kernel for AerynOS, as the early boot code is built into
    the kernel initrd images.
license     : Distributable
builddeps   :
    - binary(cpio)
install     : |
    %install_dir %(installroot)%(libdir)/firmware/intel-ucode
    %install_file intel-ucode-with-caveats/* %(installroot)%(libdir)/firmware/intel-ucode/.
    %install_file intel-ucode/* %(installroot)%(libdir)/firmware/intel-ucode/.

    # Construct early microcode initrd
    %install_dir initrd/kernel/x86/microcode/
    pushd initrd

    touch kernel/x86/microcode/GenuineIntel.bin
    for i in %(installroot)%(libdir)/firmware/intel-ucode/*; do
        cat ${i} >> kernel/x86/microcode/GenuineIntel.bin
    done

    find . -exec touch -d @0 {} \;
    find . | cpio -o -H newc --device-independent --reproducible > ../intel-microcode.initrd
    popd
    %install_file intel-microcode.initrd %(installroot)%(libdir)/kernel/initrd.d/00-intel-microcode.initrd

    for file in license releasenote.md README.md; do
        %install_file $file %(installroot)%(docdir)/intel-microcode/$file
    done
