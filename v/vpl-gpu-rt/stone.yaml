name        : vpl-gpu-rt
version     : "26.3.5"
release     : 7
homepage    : https://github.com/intel/vpl-gpu-rt/
upstreams   :
    - https://github.com/intel/vpl-gpu-rt/archive/refs/tags/intel-onevpl-26.3.5.tar.gz : 92867a0f8c09d81419102a61713e9f98dfd2af3fc9c91c6f4fb6d0c784c8e442
summary     : Intel® Video Processing Library (Intel® VPL) GPU Runtime
description : |
    Intel® Video Processing Library (Intel® VPL) GPU Runtime is a Runtime implementation of Intel® VPL API for Intel Gen GPUs. Runtime provides access to hardware-accelerated video decode, encode and filtering.
license     : MIT
builddeps   :
    - pkgconfig(igdgmm)
    - pkgconfig(libdrm)
    - pkgconfig(libva)
tuning      :
    - optimize: speed
setup       : |
    # Outlined in https://github.com/intel/vpl-gpu-rt/issues/331
    # PR from https://github.com/intel/vpl-gpu-rt/pull/381
    %patch %(pkgdir)/fix-av1-when-clang.patch

    %cmake \
        -DBUILD_TESTS=OFF \
        -DMFX_ENABLE_AENC=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
# check       : |
