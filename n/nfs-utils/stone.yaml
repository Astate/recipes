name        : nfs-utils
version     : "2.9.2"
release     : 5
homepage    : https://nfs.sourceforge.net/
upstreams   :
    - https://sourceforge.net/projects/nfs/files/nfs-utils/2.9.2/nfs-utils-2.9.2.tar.gz : 6168f3967573264b7b2d10542ec8e9670a57627f902682a1b088dac38df98abd
summary     : nfs-client capability bundle
description : |
    Network File-System client utilities
license     :
    - GPL-2.0-or-later
    - GPL-2.0-only
builddeps   :
    - pkgconfig(krb5)
    - pkgconfig(ldap)
    - pkgconfig(libcap)
    - pkgconfig(libcrypt)
    - pkgconfig(libevent)
    - pkgconfig(libsasl2)
    - pkgconfig(libtirpc)
    - pkgconfig(mount)
    - pkgconfig(readline)
    - pkgconfig(sqlite3)
    - e2fsprogs-devel
    - keyutils-devel
    - libnl-devel
    - libxml2-devel
    - rpcsvc-proto-devel
rundeps     :
    - rpcbind
setup       : |
    %patch %(pkgdir)/no-werror.patch

    sed -i "s|sbindir = /sbin|sbindir = /usr/bin|g" utils/*/Makefile.in
    sed -i "s|sbin|bin|" utils/nfsidmap/id_resolver.conf
    sed -i "s|libexec|bin|" tools/nfsrahead/99-nfs.rules

    %reconfigure \
        --sbindir=/usr/sbin \
        --disable-static \
        --enable-ipv6 \
        --enable-junction \
        --enable-libmount-mount \
        --enable-mountconfig \
        --with-systemd \
        --without-tcp-wrappers
build       : |
    %make
install     : |
    %make_install
    mv %(installroot)/sbin/* %(installroot)/usr/sbin/

    %install_dir %(installroot)%(docdir)/%(name)-devel/
    echo "DEPRECATED" > %(installroot)%(docdir)/%(name)-devel/README
tuning      :
    - thread-exceptions: false # error: cannot jump from this goto statement to its label
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/doc/nfs-utils-devel/

    - "libnfsidmap":
        paths:
            - /usr/lib/libnfsidmap.so.*
            - /usr/lib/libnfsidmap/*.so

    - "libnfsidmap-devel":
        rundeps:
            - "libnfsidmap"
        paths:
            - /usr/include/nfsidmap*.h
            - /usr/lib/libnfsidmap.so
            - /usr/lib/pkgconfig/libnfsidmap.pc
            - /usr/share/man/man3/nfs4_uid_to_name.3*
