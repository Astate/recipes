name        : neovim-qt
version     : "0.2.20"
release     : 2
upstreams   :
    - https://github.com/equalsraf/neovim-qt/archive/refs/tags/v0.2.20.tar.gz : 1ba4da6594a22c7fd950876329ca55cc483a37bfc87f586b1226eb34b8f3ce9d
homepage    : https://github.com/equalsraf/neovim-qt
license     : ISC
summary     : Neovim client library and GUI, in Qt
description : |
    Neovim client library and GUI, in Qt
builddeps   :
    - binary(doxygen)
    - binary(nvim)
    - binary(python)
    - cmake(Qt6)
    - cmake(Qt6SvgWidgets)
    - cmake(msgpack-c)
rundeps     :
    - binary(nvim)
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/Fix-msgpack-c-version-check.patch

    %cmake \
        -DUSE_SYSTEM_MSGPACK=ON \
        -DWITH_QT=Qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
